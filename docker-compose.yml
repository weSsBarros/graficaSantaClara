# Sistema da Gráfica Santa Clara em um servidor (VPS) com HTTPS automático.
#
#   1. copie deploy/.env.example para .env e preencha o domínio
#   2. docker compose up -d --build                      (só o sistema)
#      docker compose --profile whatsapp up -d --build   (sistema + WhatsApp pela Evolution API)
#
# Guia completo: docs/HOSPEDAGEM.md

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
    volumes:
      - dados:/data            # banco de dados e backups diários

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no arquivo .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # ---------- WhatsApp (opcional): docker compose --profile whatsapp up -d ----------
  # No sistema, em Configurações → Avisos → Evolution API, use:
  #   Endereço da API: http://evolution-api:8080   ·   Chave: o EVOLUTION_API_KEY do .env
  evolution-api:
    profiles: ["whatsapp"]
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # só acessível pelo próprio servidor (use um túnel SSH para ler o QR code)
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-troque-esta-senha}@evolution-postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - evolution-postgres
      - evolution-redis

  evolution-postgres:
    profiles: ["whatsapp"]
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-troque-esta-senha}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

  evolution-redis:
    profiles: ["whatsapp"]
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data

volumes:
  dados:
  caddy_data:
  caddy_config:
  evolution_instances:
  evolution_pg:
  evolution_redis:
